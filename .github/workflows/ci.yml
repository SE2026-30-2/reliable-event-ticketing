name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service:
          - identity-service
          - ticketing-platform
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/${{ matrix.service }}/pom.xml

      - name: Run tests
        working-directory: backend/${{ matrix.service }}
        run: bash ./mvnw -B -ntp verify

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Run unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker Compose smoke test
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Build and start the stack
        run: |
          docker compose --env-file .env.example build identity-service
          docker compose --env-file .env.example build ticketing-platform
          docker compose --env-file .env.example build frontend
          docker compose --env-file .env.example up -d --no-build --wait --wait-timeout 300

      - name: Check service health and API endpoints
        run: |
          curl --fail --silent --show-error http://localhost:8087/actuator/health/liveness
          curl --fail --silent --show-error http://localhost:8087/.well-known/jwks.json
          curl --fail --silent --show-error http://localhost:8091/actuator/health/liveness
          curl --fail --silent --show-error http://localhost:8091/api/event
          curl --fail --silent --show-error http://localhost:5173/healthz

      - name: Stop containers
        if: always()
        run: docker compose --env-file .env.example down -v --remove-orphans
