limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;

    # Docker's DNS resolver tracks backend container IP changes.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $identity_backend identity-service:8087;
    set $ticketing_backend ticketing-platform:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # Replace any client-supplied value instead of trusting it.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    limit_req_status 429;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/user {
        limit_req zone=api_per_ip burst=30 nodelay;
        proxy_pass http://$identity_backend;
    }

    location ^~ /api/user/ {
        limit_req zone=api_per_ip burst=30 nodelay;
        proxy_pass http://$identity_backend;
    }

    location = /api {
        limit_req zone=api_per_ip burst=30 nodelay;
        proxy_pass http://$ticketing_backend;
    }

    location ^~ /api/ {
        limit_req zone=api_per_ip burst=30 nodelay;
        proxy_pass http://$ticketing_backend;
    }

    # The check-in PWA verifies ticket signatures against this public key.
    location = /.well-known/jwks.json {
        limit_req zone=api_per_ip burst=30 nodelay;
        proxy_pass http://$ticketing_backend;
    }

    # Keep the check-in service worker fresh so new builds can replace it.
    location = /checkin-sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # Vite fingerprints generated assets, so they can be cached long-term.
    location ~* \.(?:css|js|mjs|svg|png|jpe?g|gif|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routes such as /events/... must resolve to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
