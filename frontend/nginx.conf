server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Keep the check-in service worker fresh so new builds can replace it.
    location = /checkin-sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # Vite fingerprints generated assets, so they can be cached long-term.
    location ~* \.(?:css|js|mjs|svg|png|jpe?g|gif|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routes such as /events/... must resolve to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
