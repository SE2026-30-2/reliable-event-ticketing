spring.application.name=ticketing-platform

# Test-only H2 in-memory DB, used only by TicketingPlatformApplicationTests' contextLoads() smoke
# test - see order-service's test application.properties for the full rationale (Docker-outside-
# of-Docker not reliably reachable from every CI/sandbox this project runs in).
spring.datasource.url=jdbc:h2:mem:ticketing_platform;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

security.jwt.jwk-set-uri=http://localhost:8087/.well-known/jwks.json

# This service's own QR-signing key - generated fresh under target/ (gitignored, throwaway) on
# every test run. require-existing-key=false here is deliberate: this is a smoke test proving the
# application context wires up, not a test of RsaKeyProvider's hard-fail behavior (see
# TicketQrSignerTest for that).
ticketing.qr.private-key-path=./target/test-keys/ticket_signing_key.pem
ticketing.qr.require-existing-key=false
ticketing.qr.issuer=ticketing-platform

# Kafka: bootstrap-servers is unreachable in this test environment on purpose. Listener containers
# are not auto-started, so nothing attempts to connect at context-startup time - this is a context
# smoke test, not an integration test of the listeners themselves.
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.auto-startup=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

kafka.topic.ticket-reserved=ticket-reserved
kafka.topic.ticket-issued=ticket-issued
kafka.topic.ticket-voided=ticket-voided
kafka.topic.ticket-resend-requested=ticket-resend-requested
kafka.topic.payment-completed=payment-completed
kafka.topic.payment-failed=payment-failed
kafka.topic.email-verification-requested=email-verification-requested
kafka.topic.password-reset-requested=password-reset-requested

ticketing.reservation.expiry-minutes=10

cors.allowed-origins=http://localhost:5173

frontend.base-url=http://localhost:5173
notification.mail.from=no-reply@gatekeep.example
notification.mail.verification.subject=Verify your email address
notification.mail.verification.body-template=Hi %s,\n%s
notification.mail.verification.link-template=${frontend.base-url}/verify-email?token=%s
notification.mail.password-reset.subject=Reset your password
notification.mail.password-reset.body-template=Hi %s,\n%s
notification.mail.password-reset.link-template=${frontend.base-url}/reset-password?token=%s
notification.mail.ticket-issued.subject=Your ticket is confirmed
notification.mail.ticket-issued.body-template=<p>Hi %s</p><img src="cid:%s">
spring.mail.host=localhost
spring.mail.port=2525

kafka.topic.payment-refunded=payment-refunded
notification.mail.ticket-voided.subject=Your ticket has changed
notification.mail.ticket-voided.body-template=Hi %s, your ticket %s (%s)
ticketing.require-verified-email=false

notification.mail.waitlist-offered.subject=Tickets available
notification.mail.waitlist-offered.body-template=Hi %s, %d %s %s %s
kafka.topic.waitlist-offered=waitlist-offered
ticketing.waitlist.interval-ms=3600000
