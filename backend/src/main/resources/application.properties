spring.application.name=ticketing-platform
spring.datasource.url=jdbc:postgresql://localhost:5437/ticketing_platform
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=8091

# JWT verification - RSA public key fetched from user-service's JWK Set endpoint, no shared secret
# between the two services. Used only to gate ROLE_ADMIN endpoints (create event/ticket-type,
# void/refund a ticket) - see config.SecurityConfig. This is a completely separate signing domain
# from this service's own QR-payload signing key below.
security.jwt.jwk-set-uri=${SECURITY_JWT_JWK_SET_URI:http://localhost:8087/.well-known/jwks.json}

# QR-payload signing key (RS256): this app's OWN key for the catalog module, independent of
# user-service's login-JWT key (deliberately a different property prefix than security.jwt.* above,
# since that one is about *validating* user-service's JWT, not this app's own signing domain).
# Generated on first startup if the file does not exist AND require-existing-key=false; once a
# ticket has been signed and handed out, silently rotating this key would invalidate every QR code
# already issued/printed, so require-existing-key defaults to true everywhere except a fresh
# local-dev bootstrap - see catalog.infrastructure.security.RsaKeyProvider.
ticketing.qr.private-key-path=${TICKETING_QR_PRIVATE_KEY_PATH:./keys/ticket_signing_key.pem}
ticketing.qr.require-existing-key=${TICKETING_QR_REQUIRE_EXISTING_KEY:false}
ticketing.qr.issuer=${TICKETING_QR_ISSUER:ticketing-platform}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Only health+info by default; /actuator/env, /beans, /heapdump, /prometheus leak internals and are unauthenticated.
# Add prometheus via MANAGEMENT_ENDPOINTS_EXPOSURE only when the port is protected at the network level.
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_EXPOSURE:health,info}
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092

# Every outbox-backed publish in this app (catalog's reserve/confirm/cancel flows, payment's
# outcome events) goes through the one shared OutboxRelayPublisher - plain JSON strings, no
# Spring-Kafka type headers, same convention the original CommerceForge services used.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Consumer: catalog's PaymentEventListener (payment-completed/failed -> confirm/cancel a
# reservation) is this app's first consumer - value-deserializer is a plain StringDeserializer to
# match the headerless-JSON producer side; see shared.config.KafkaConsumerConfig for how a typed
# POJO still comes out the other end (per-@KafkaListener-method type inference, no type headers
# needed).
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka topic names (externalized instead of hardcoded string literals). ticket-reserved/issued/
# voided and payment-completed/failed are this app's own internal module contract (catalog <->
# payment <-> checkin <-> notification, all consumed in-process); email-verification-requested/
# password-reset-requested are user-service's external contract - do not change any of these
# without coordinating with every consumer (see each module's @KafkaListener groupId - every
# listener uses its own module-scoped group, e.g. ticketing-platform-checkin, so checkin and
# notification each get their own full copy of ticket-voided rather than competing for it).
kafka.topic.ticket-reserved=ticket-reserved
kafka.topic.ticket-issued=ticket-issued
kafka.topic.ticket-voided=ticket-voided
kafka.topic.ticket-resend-requested=ticket-resend-requested
kafka.topic.payment-completed=payment-completed
kafka.topic.payment-failed=payment-failed
kafka.topic.email-verification-requested=email-verification-requested
kafka.topic.password-reset-requested=password-reset-requested

# How long a reservation holds quota before ExpireReservationsJob releases it unpaid.
ticketing.reservation.expiry-minutes=${TICKETING_RESERVATION_EXPIRY_MINUTES:10}

# Mock payment gateway (MockPaymentGatewayAdapter) - fraction of unforced charges that succeed.
ticketing.payment.success-rate=${TICKETING_PAYMENT_SUCCESS_RATE:0.9}

# CORS - frontend-buyer calls this service directly (no API gateway in this rearchitecture).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- notification module ---

frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
# Many providers (Gmail, SendGrid, SES) only deliver mail whose From is a sender/domain you verified with them.
notification.mail.from=${MAIL_FROM:no-reply@gatekeep.example}

notification.mail.verification.subject=GateKeep: Verify your email address
notification.mail.verification.body-template=Hi %s,\n\nPlease verify your email address by opening the link below:\n%s\n\nThis link expires in 24 hours. If you did not create an account, you can safely ignore this email.\n\nBest regards,\nGateKeep Team
notification.mail.verification.link-template=${frontend.base-url}/verify-email?token=%s

notification.mail.password-reset.subject=GateKeep: Reset your password
notification.mail.password-reset.body-template=Hi %s,\n\nWe received a request to reset your password. Open the link below to choose a new one:\n%s\n\nThis link expires in 1 hour. If you did not request this, you can safely ignore this email - your password will not change.\n\nBest regards,\nGateKeep Team
notification.mail.password-reset.link-template=${frontend.base-url}/reset-password?token=%s

# HTML (not plain text, unlike the two above) - must contain <img src="cid:%s"> exactly where the
# QR code should render; see TicketNotificationApplicationService/QrImageRenderer.
notification.mail.ticket-issued.subject=Your ticket is confirmed - here's your QR code
notification.mail.ticket-issued.body-template=<p>Hi %s,</p><p>Your ticket is confirmed. Present the QR code below at check-in:</p><p><img src="cid:%s"></p><p>Best regards,<br>GateKeep Team</p>

spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# Real providers (port 587) need auth + STARTTLS; both are on by default and harmless for Mailtrap.
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# --- abuse protection (buyer endpoints are anonymous) ---
ticketing.reservation.max-active-per-email=${TICKETING_RESERVATION_MAX_ACTIVE_PER_EMAIL:10}
ticketing.rate-limit.reservations-per-window=${TICKETING_RATE_LIMIT_RESERVATIONS:10}
ticketing.rate-limit.payments-per-window=${TICKETING_RATE_LIMIT_PAYMENTS:20}
ticketing.rate-limit.resends-per-window=${TICKETING_RATE_LIMIT_RESENDS:5}
ticketing.rate-limit.window-seconds=${TICKETING_RATE_LIMIT_WINDOW_SECONDS:60}
# true ONLY behind a reverse proxy that overwrites X-Forwarded-For (see RateLimitFilter).
ticketing.rate-limit.trust-forwarded-for=${TICKETING_RATE_LIMIT_TRUST_FORWARDED_FOR:false}
# Demo hook letting a caller pick the payment result - must stay false outside local demos.
ticketing.payment.allow-force-outcome=${TICKETING_PAYMENT_ALLOW_FORCE_OUTCOME:false}

# Every log line carries the request's correlation id (see shared.web.CorrelationIdFilter).
logging.pattern.level=%5p [%X{correlationId:-}]

# Published outbox rows older than this are deleted hourly (unpublished rows are never deleted).
ticketing.outbox.retention-days=${TICKETING_OUTBOX_RETENTION_DAYS:7}

# Online payments. provider=mock (default) keeps the synchronous fake; provider=vnpay redirects to
# VNPay's hosted page (sandbox by default) and settles via signed IPN / querydr / reconciliation.
ticketing.payment.provider=${TICKETING_PAYMENT_PROVIDER:mock}
ticketing.payment.vnpay.tmn-code=${VNPAY_TMN_CODE:}
ticketing.payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
ticketing.payment.vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
ticketing.payment.vnpay.api-url=${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
ticketing.payment.vnpay.return-url=${VNPAY_RETURN_URL:}
ticketing.payment.vnpay.order-type=${VNPAY_ORDER_TYPE:other}
ticketing.payment.vnpay.server-ip=${VNPAY_SERVER_IP:127.0.0.1}
ticketing.payment.reconcile.interval-ms=${TICKETING_PAYMENT_RECONCILE_MS:60000}
ticketing.payment.reconcile.query-after-seconds=90
ticketing.payment.reconcile.expiry-grace-seconds=120
kafka.topic.payment-refunded=payment-refunded

# Plain text; %s = holder name, what happened ("has been cancelled"...), the reason.
notification.mail.ticket-voided.subject=GateKeep: Your ticket has changed
notification.mail.ticket-voided.body-template=Hi %s,\n\nYour ticket %s (reason: %s). Its QR code will no longer be accepted at the entrance.\n\nIf you did not expect this, please contact the event organizer.\n\nBest regards,\nGateKeep Team

# Buying needs a verified email (JWT claim email_verified from user-service). Turn off only for local demos.
ticketing.require-verified-email=${TICKETING_REQUIRE_VERIFIED_EMAIL:true}

# Ticket transfer: how many times one ticket may change hands, and how close to the start it stops.
ticketing.transfer.max-per-ticket=${TICKETING_TRANSFER_MAX:2}
ticketing.transfer.cutoff-minutes-before-start=${TICKETING_TRANSFER_CUTOFF_MINUTES:60}

# Waitlist: %s name, %d tickets, %s event, %s hold-until, %s link.
notification.mail.waitlist-offered.subject=GateKeep: Tickets are available for you
notification.mail.waitlist-offered.body-template=Hi %s,\n\nGood news - %d ticket(s) for "%s" have just become available and are held for you until %s.\n\nComplete your purchase here before the hold expires:\n%s\n\nIf you no longer want them, ignore this email and they will go to the next person.\n\nBest regards,\nGateKeep Team
kafka.topic.waitlist-offered=waitlist-offered
ticketing.waitlist.interval-ms=${TICKETING_WAITLIST_INTERVAL_MS:30000}
ticketing.waitlist.max-active-per-account=5
