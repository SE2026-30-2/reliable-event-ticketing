spring.application.name=ticketing-platform
server.port=${SERVER_PORT:8091}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5437/ticketing_platform}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Notification topics consumed by this service's independent notification group.
kafka.topic.ticket-resend-requested=${KAFKA_TOPIC_TICKET_RESEND_REQUESTED:ticket-resend-requested}
kafka.topic.waitlist-offered=${KAFKA_TOPIC_WAITLIST_OFFERED:waitlist-offered}
kafka.topic.email-verification-requested=${KAFKA_TOPIC_EMAIL_VERIFICATION_REQUESTED:email-verification-requested}
kafka.topic.password-reset-requested=${KAFKA_TOPIC_PASSWORD_RESET_REQUESTED:password-reset-requested}

# Notification mail delivery.
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
notification.mail.from=${MAIL_FROM:no-reply@reliable-event-ticketing.local}
notification.mail.verification.subject=Verify your email address
notification.mail.verification.body-template=Hi %s, verify your email address by opening this link: %s
notification.mail.verification.link-template=${frontend.base-url}/verify-email?token=%s
notification.mail.password-reset.subject=Reset your password
notification.mail.password-reset.body-template=Hi %s, reset your password by opening this link: %s
notification.mail.password-reset.link-template=${frontend.base-url}/reset-password?token=%s
notification.mail.ticket-issued.subject=Your ticket is confirmed
notification.mail.ticket-issued.body-template=<p>Hi %s,</p><p>Present this QR code at check-in:</p><p><img src="cid:%s"></p>
notification.mail.ticket-voided.subject=Your ticket status has changed
notification.mail.ticket-voided.body-template=Hi %s, your ticket %s (reason: %s). Its QR code is no longer valid.
notification.mail.waitlist-offered.subject=Tickets are available
notification.mail.waitlist-offered.body-template=Hi %s, %d ticket(s) for "%s" are held until %s. Complete your purchase: %s

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

security.jwt.jwk-set-uri=${SECURITY_JWT_JWK_SET_URI:http://localhost:8087/.well-known/jwks.json}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_EXPOSURE:health,info}
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

logging.pattern.level=%5p [%X{correlationId:-}]
