spring.application.name=user-service
spring.datasource.url=jdbc:postgresql://localhost:5436/user_service
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=8087

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Only health+info by default; /actuator/env, /beans, /heapdump, /prometheus leak internals and are unauthenticated.
# Add prometheus via MANAGEMENT_ENDPOINTS_EXPOSURE only when the port is protected at the network level.
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_EXPOSURE:health,info}
management.endpoint.health.show-details=never
# Dev seeds (a known admin) live in db/dev-seed and are added to this list ONLY in dev - see .env.example.
spring.flyway.locations=${SPRING_FLYWAY_LOCATIONS:classpath:db/migration}
# /actuator/health/liveness only reflects the application context itself, not optional external
# dependencies (DB/Kafka/mail/etc. indicators) which can transiently report DOWN without the app
# itself being broken. docker-compose.yml's healthcheck targets this narrower endpoint instead of
# the full aggregate /actuator/health for exactly that reason - see notification-service's
# application.properties for the concrete case (Mailtrap placeholder credentials) that motivated
# this across all 9 services.
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092

# Producer only - this service never consumes Kafka events, it is the auth source of truth, not a
# saga participant. OutboxRelayPublisher relays already-JSON-serialized outbox row payloads
# verbatim - both key (aggregate_id) and value (payload) are plain strings, not objects for
# Jackson to serialize. Same convention as payment-service/order-service.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Kafka topic names (externalized instead of hardcoded string literals) - exact names are part of
# the finalized cross-service contract with notification-service, do not change without
# coordinating with it.
kafka.topic.email-verification-requested=email-verification-requested
kafka.topic.password-reset-requested=password-reset-requested

# RSA signing key (RS256): generated on first startup if the file at this path does not exist yet
# (see infrastructure.security.RsaKeyProvider), then reused on every subsequent startup so
# previously-issued JWTs and the JWKS response stay valid across restarts. docker-compose mounts a
# named volume at /app/keys for exactly this reason; the ./keys default here is for running the
# service directly on the host with Maven.
security.jwt.private-key-path=${SECURITY_JWT_PRIVATE_KEY_PATH:./keys/private_key.pem}
security.jwt.issuer=${SECURITY_JWT_ISSUER:user-service}
security.jwt.access-token-ttl-seconds=${SECURITY_JWT_ACCESS_TOKEN_TTL_SECONDS:900}
security.jwt.refresh-token-ttl-seconds=${SECURITY_JWT_REFRESH_TOKEN_TTL_SECONDS:604800}

# Account lockout: after this many consecutive failed login attempts, the account's status flips
# to LOCKED (see UserApplicationService#login) and every further login attempt is rejected with
# 423 Locked until an admin unlocks it via PATCH /api/user/admin/users/{id}/status.
security.account.max-failed-login-attempts=${SECURITY_ACCOUNT_MAX_FAILED_LOGIN_ATTEMPTS:5}

# Rate limiting (config.RateLimitFilter): caps repeated calls, per client IP, to
# /api/user/register, /api/user/password/forgot and /api/user/email/verify/resend - the three
# endpoints with no other limit on how many times they can be invoked. Fixed window: at most
# max-requests calls per window-seconds, per (route, IP) pair.
security.rate-limit.auth-endpoints.max-requests=${SECURITY_RATE_LIMIT_AUTH_MAX_REQUESTS:5}
security.rate-limit.auth-endpoints.window-seconds=${SECURITY_RATE_LIMIT_AUTH_WINDOW_SECONDS:60}
